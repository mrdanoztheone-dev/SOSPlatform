---
layout: default
---

<article class="project-update">
  <header class="project-update__header">
    <p class="project-update__meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.kind %} · {{ page.kind }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="project-update__summary">{{ page.summary }}</p>{% endif %}
  </header>

  {% if page.image %}
  <figure class="project-update__figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
    {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}

  <div class="project-update__content">
    {{ content }}
  </div>

  <p class="project-update__back"><a href="{{ '/updates.html' | relative_url }}">← All project updates</a></p>
</article>
